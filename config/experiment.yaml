# Experiment configuration (Faz 0). Keep smoke-test values small; scale up later.
models:
  - name: gemma3
    provider: ollama
    litellm_id: ollama_chat/gemma3:latest
    api_base: http://localhost:11434
  - name: qwen2.5
    provider: ollama
    litellm_id: ollama_chat/qwen2.5:7b
    api_base: http://localhost:11434
  # API model (needs ANTHROPIC_API_KEY in .env); swap in without code changes:
  # - name: api_model
  #   provider: anthropic
  #   litellm_id: anthropic/claude-haiku-5-5
  #   api_key_env: ANTHROPIC_API_KEY

agent:
  temperature: 0
  max_retries: 2
  routing_targets: [billing, technical_support, account_management, legal, sales, operations, none]

acl_modes: [M1_weak, M2_strong]

acl_labels: [public, internal, confidential]

data:
  raw_dir: data/raw
  labeled_dir: data/labeled
  canaries_dir: data/canaries
  acl_override_csv: data/labeled/acl_overrides.csv
  enron_url: https://www.cs.cmu.edu/~enron/enron_mail_20150507.tar.gz
  enron_archive: data/raw/enron_mail.tar.gz
  max_docs: 2000              # smoke-test sample size
  min_body_chars: 80

index:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chroma_dir: data/chroma
  top_k: 5

canaries:
  n_topics: 10                # topics WITH injected docs (c00-c03 + c08-c13)
  n_absent_topics: 10         # fictitious topics with NO docs (predicate = 0)
  docs_per_canary: 3
  llm_model: anthropic/claude-sonnet-5-5   # needs ANTHROPIC_API_KEY in .env
  api_base: null                          # set http://localhost:11434 for ollama_chat/* models
  seed: 42

probes:
  variants_per_topic: 5       # M paraphrases
  repeats: 2
  probes_file: data/probes/probes.json
  direct_queries_file: data/probes/direct_queries.json
  length_tolerance: 0.25      # max relative char-length gap between paired probe/control
  smoke: {topics: [c00, c04], variants: 2, repeats: 1}

decoders:
  seed: 42
  n_row_perm: 100            # row-level label shuffles per group
  n_topic_perm: 500          # Monte-Carlo topic relabelings when C(n,k) is too large to enumerate
  max_exact_perm: 5000       # enumerate all balanced labelings up to this many
  n_boot: 200                # bootstrap resamples (CI, messages_needed)
  fpr: 0.01
  auc_target: 0.9            # topic-level AUC target for messages_needed
  C: 1.0                     # fixed logistic-regression regularization (no tuning)
  pca_components: 5          # for the embedding block
  groups: [behavior_nolat, behavior, text, behavior+text]
  embeddings_cache: results/cache/embeddings.npz
  features_csv: results/features.csv
  results_csv: results/decoder_results.csv
  stat_tests_json: results/stat_tests.json

defenses:
  names: [none, behavior_norm, scoped_context, decision_hiding, all]
  mode: M1_weak                 # the weak configuration the defenses protect
  refusal_template: "I'm sorry, I'm not able to help with that request here. Please contact our support team and they will follow up with you."
  canonical_refusal_type: deflect
  latency_pad_ms: 60000         # constant externally visible latency (> every raw latency)
  ctxfree_cache: results/cache/ctxfree_decisions.jsonl
  utility_file: data/probes/utility_queries.json
  runs_dir: results/runs
  results_csv: results/defense_results.csv

masking:                        # Defense 4: confidential chunks stay, sensitive spans masked (plans/maskeleme_plan.md)
  kinds: [oracle, rule]
  spans_file: data/probes/secret_spans.json
  utility_conf_file: data/probes/utility_conf.json
  results_csv: results/mask_results.csv

multiuser:
  modes: [X1_shared_weak, X2_isolated, X3_shared_summary]   # X0 (empty memory) == B's view under X2
  user_probe: B
  shares_file: data/xuser/shares.json
  memory_top_k: 2
  summary_cache: results/cache/xuser_summary.json
  log: results/runs/xuser.jsonl
  results_csv: results/xuser_results.csv

query_budget: 200             # max messages per decoder run
random_seed: 42

paths:
  agent_log: results/agent_log.jsonl
  probe_run_summary: results/probe_run_summary.json
  baseline_check: results/baseline_check.json
  data_summary: results/data_summary.json
  results_dir: results
